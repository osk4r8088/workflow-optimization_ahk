[Modules]
autoclick=0
multitask=0
copypaste=0
stringpaste=0
textexpander=0
mediakeys=0
autoreplace=0
cliphistory=0
windowtools=0
quicknote=0
searchselection=0

[AutoClick]
DelayMs=30
Button=Left

[CopyPaste]
CopyHotkey=XButton1
PasteHotkey=XButton2

[MultiTask]
PlainPaste=^+v
DateTime=NumpadMult
FileStamp=NumpadSub
Edge=Numpad7
NotepadPP=Numpad8
Teams=Numpad9
Outlook=NumpadAdd

[MultiTask.Paths]
edge=
notepadpp=C:\Program Files\Notepad++\notepad++.exe
teams=
outlook=

[StringPaste]
Hotkey=^!p
Text=paste

[TextExpander]
@@=example@email.com
addr=123 Example Street, City
sig=Best regards, Your Name
btw=by the way
omw=on my way

[MediaKeys]
PlayPause=Numpad0
Next=Numpad6
Prev=Numpad4
VolUp=Numpad2
VolDown=Numpad5
Mute=Numpad1

[ToggleHotkeys]
; per-module on/off toggle hotkeys, e.g. cliphistory=^!F1
; easiest way to set these: tray -> Hotkey Settings

[ClipHistory]
Hotkey=^!h
MaxItems=15

[WindowTools]
AlwaysOnTop=^!t
NextMonitor=^!m
Center=^!c

[QuickNote]
Hotkey=^!n
OpenHotkey=
File=notes.txt

[SearchSelection]
Hotkey=^!s
URL=https://www.google.com/search?q=%s

[AutoReplace]
teh=the
recieve=receive
definately=definitely
seperate=separate
occured=occurred
adn=and
dont=don't
cant=can't
wont=won't
im=I'm
